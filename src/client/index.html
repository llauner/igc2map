<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>igc2map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="panel">
        <h1>IGC Track Viewer</h1>
        <section id="selected-track-section" style="display: none;">
          <h2>Selected Track</h2>
          <dl id="selected-track-info" class="summary"></dl>
          <button id="reset-button" class="reset-button">Show All Tracks</button>
        </section>
        <section>
          <h2>Source Summary</h2>
          <dl id="source-summary" class="summary"></dl>
        </section>
        <section>
          <h2>Parse Errors</h2>
          <ul id="error-list" class="error-list"></ul>
        </section>
      </aside>
      <section class="map-wrap">
        <div id="map" class="map" aria-label="Map of IGC tracks"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
